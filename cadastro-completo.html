<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/cadastro.css">
    <title>Registo Completo | FreelaMG</title>
</head>

<body>
    <header class="cabecalho">
        <!-- Adicionei o botão de voltar para não perder a navegação caso a pessoa desista aqui -->
        <a href="cadastro.html" class="pagina-inicial">&larr; Voltar</a>
    </header>
    <main>

        <h1 class="titulo"> Só mais umas coisinhas...</h1>
        <form class="form" action="vagas.html">

            <!-- DADOS PESSOAIS (Lado a lado) -->
            <div class="linha-dupla">

                <div class="form-telefone">
                    <label for="telefone">Telefone</label>
                    <input id="telefone" type="tel" placeholder="Insira o seu número">
                </div>

                <div class="form-data">
                    <label for="data">Data de Nascimento</label>
                    <input id="data" name="data_nascimento" type="date" autocomplete="bday" required>
                </div>

            </div>

            <!-- GRUPO DE ENDEREÇO -->
            <div class="grupo-endereco">
                <div class="form-cep">
                    <label for="cep">CEP</label>
                    <input id="cep" name="cep" type="text" inputmode="numeric" autocomplete="postal-code" maxlength="9" pattern="[0-9]{5}-?[0-9]{3}" title="Digite o CEP com 8 números. Ex.: 37900-000" placeholder="00000-000" required>
                </div>

                <div class="form-estado">
                    <label for="estado">Estado</label>
                  <input id="estado" name="estado" type="text" autocomplete="address-level1" placeholder="Digite o estado" required>
                </div>

                <div class="form-cidade">
                    <label for="cidade">Cidade</label>
                    <input id="cidade" name="cidade" type="text" autocomplete="address-level2" placeholder="Digite a cidade" required>
                </div>

                <div class="form-bairro">
                    <label for="bairro">Bairro</label>
                    <input id="bairro" name="bairro" type="text" placeholder="Digite o bairro" required>
                </div>

                <div class="form-rua">
                    <label for="rua">Rua</label>
                    <input id="rua" name="rua" type="text" autocomplete="address-line1" placeholder="Digite a rua" required>
                </div>

                <div class="form-numero">
                    <label for="numero">Número</label>
                    <input id="numero" name="numero" type="text" inputmode="numeric" placeholder="Número" required>
                </div>

                <div class="form-complemento">
                    <label for="complemento">Complemento</label>
                    <input id="complemento" name="complemento" type="text" autocomplete="address-line2" placeholder="Apto, bloco... (opcional)">
                </div>
            </div>

            <div class="form-final">
                <input class="finalizar-registro" type="submit" value="Concluir cadastro">
            </div>

        </form>
    </main>
</body>

</html>
