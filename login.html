<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FreelaMG</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>

<body>

    <header class="cabecalho">
        <a href="index.html" class="pagina-inicial"> &larr; Página Inicial</a>
    </header>

    <main>
        <h2>Bem vindo de volta!</h2>

        <form action="vagas.html">
            <div class="form-grupo">
                <label for="email">Email:</label>
                <input id="email" type="email" placeholder="insira seu email">
            </div>

            <div class="form-grupo">
                <label for="senha">Senha:</label>
                <input id="senha" type="password" placeholder="Escreva sua senha aqui">
            </div>

            <input class="continuar" type="submit" value="Entrar">

            <section class="para-login">
                <p class="pergunta-login">Não tem uma conta?</p>
                <a class="link-cadastro" href="cadastro.html">Registre-se</a>
            </section>
        </form>
    </main>
</body>

</html>
